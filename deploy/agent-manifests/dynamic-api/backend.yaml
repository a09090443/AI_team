display_information:
  name: DA Backend Agent
  description: 前後端功能、測試與文件實作
  background_color: "#2e8b57"
  long_description: >-
    這是 dynamic-api 專案 AI 軟體團隊中的「DA Backend Agent」角色，以 workspace 內獨立使用者的身分發言，讓每個角色在討論串中可以被清楚區分與個別 @ 提及。它在隔離工作區修改 Spring Boot 後端、Next.js 管理介面、範例 JAR 與文件網站，並依固定操作建置與測試。本 App 只接收允許頻道內直接 @本角色的訊息，只有中央白名單內的真實使用者可以提出請求。一般提問採唯讀對話，明確的執行請求仍交由中央 orchestrator 管理排程、驗收與審批；推分支與開 PR 仍須人工核准。本 App 屬於 dynamic-api 專案（Dynamic API Manager，Mock API 伺服器）的 AI 軟體團隊服務實例，只能加入 #dynamic-api 頻道，不可與 bestpartner 或 zipe-spring-boot-starters 的服務共用 token，否則 Socket Mode 事件可能被其他專案的服務接走。
features:
  bot_user:
    display_name: DA-Backend-Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
