display_information:
  name: dynamic-api-ai-team
  description: AI Software Team for dynamic-api
  background_color: "#2c2d30"
  long_description: >-
    這是 dynamic-api 專案（Dynamic API Manager）的 AI 軟體團隊主 App。在 #dynamic-api 頻道 @ 提及即可把開發任務交給它，任務會依序經過 PM、Architecture、Backend、QA、Code Reviewer 等角色分工處理，每個角色以自己的身分發言。每個階段的結果都回報在原討論串，需要真人決定時提供按鈕。所有會修改程式碼的操作都在隔離工作區進行，推送分支與建立 Pull Request 一律需要人工核准。本 App 僅回應被明確 @ 的訊息，不讀取頻道其他對話，只有允許清單中的使用者能觸發任務。本 App 屬於 dynamic-api 專案（Dynamic API Manager，Mock API 伺服器）的 AI 軟體團隊服務實例，只能加入 #dynamic-api 頻道，不可與 bestpartner 或 zipe-spring-boot-starters 的服務共用 token，否則 Socket Mode 事件可能被其他專案的服務接走。
features:
  bot_user:
    display_name: dynamic-api-ai-team
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
