display_information:
  name: Code Reviewer
  description: 開 PR 前的第二意見
  background_color: "#6b5b95"
  long_description: >-
    這是 zipe-spring-boot-starters 專案 AI 軟體團隊中的「Code Reviewer」角色，
    以 workspace 內獨立使用者的身分存在，讓每個角色的發言在討論串中可以被清楚區分，
    也能被個別 @ 提及與查看個人檔案。它在 QA 之後、開 PR 之前檢視即將送出的最終狀態，
    看的是設計與可維護性、規範遵循、向後相容性與錯誤處理，並提出具體的 review 意見。
    它是唯讀的，不修改任何程式碼；正式審查無法核實或要求修正時會阻擋發布。
    本 App 會接收允許頻道內直接 @本角色的訊息，只有中央白名單內的真實使用者可以提出請求。
    一般提問採唯讀對話，明確的執行請求仍交由中央 orchestrator 管理排程、驗收與審批。
    Agent 彼此的交接訊息不會觸發工作。聊天不能取代 QA 或 Code Review，推分支與開 PR
    仍須人工核准。請將本 App 邀請進 AI 團隊所在的頻道，並設定它自己的 Socket Mode Token。
features:
  bot_user:
    display_name: Code Reviewer
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
