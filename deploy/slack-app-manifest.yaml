display_information:
  name: zipe-ai-team
  description: AI Software Team for zipe-spring-boot-starters
  background_color: "#2c2d30"
  long_description: >-
    這是 zipe-spring-boot-starters 專案的 AI 軟體團隊。在 Slack 頻道中 @ 提及即可把開發任務交給它，
    任務會依序經過 PM、Architecture、Backend、QA 四個角色分工處理，每個角色以自己的名稱與圖示發言。
    每個階段的結果都會回報在原本的討論串中，並附上核准、要求重做、中止三個按鈕，
    由真人決定是否進入下一個階段，不會一路跑到底。所有會修改程式碼的操作都在隔離的工作區中進行，
    推送分支與建立 Pull Request 一律需要經過人工核准之後才會執行。
    本 App 僅回應被明確 @ 提及的訊息，不會讀取頻道中的其他對話內容，
    而且只有位於允許清單中的使用者能夠觸發任務，其他人的請求會被直接拒絕並回覆說明。
features:
  bot_user:
    display_name: zipe-ai-team
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
